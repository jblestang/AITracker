[package]
name = "ai-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Linear algebra and math
nalgebra = "0.32"
rand = "0.8"

# GUI and visualization
eframe = "0.24"
egui = "0.24"

# Serialization (for potential data export)
serde = { version = "1.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# Testing utilities
approx = "0.5"

